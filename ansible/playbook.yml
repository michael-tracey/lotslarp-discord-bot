---
- name: Deploy Discord Bot
  hosts: all
  become: yes
  vars:
    # Passed via --extra-vars from deploy-gce.sh
    # docker_image: "..."
    # env_file_src: "..."
    # map_url: "..."
    app_dir: "/opt/docker-apps/lotslarp-bot"

  tasks:
    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Copy .env file
      copy:
        src: "{{ env_file_src }}"
        dest: "{{ app_dir }}/.env"
        mode: '0600'

    - name: Remove DCE_CLI_PATH from .env (use Dockerfile default)
      lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: '^DCE_CLI_PATH='
        state: absent

    - name: Set LOTSLARP_MAP_URL in .env
      lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: '^LOTSLARP_MAP_URL='
        line: "LOTSLARP_MAP_URL={{ map_url }}"
        state: present

    - name: Get GCE service account token
      shell: 'curl -s -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" | python3 -c "import sys,json; print(json.load(sys.stdin)[\"access_token\"])"'
      register: gce_token
      changed_when: false

    - name: Log in to Artifact Registry
      community.docker.docker_login:
        registry: us-east1-docker.pkg.dev
        username: oauth2accesstoken
        password: "{{ gce_token.stdout }}"

    - name: Pull Docker image
      community.docker.docker_image:
        name: "{{ docker_image }}"
        source: pull
        force_source: yes

    - name: Stop old container
      community.docker.docker_container:
        name: discord-bot
        state: absent

    - name: Run Discord bot container
      community.docker.docker_container:
        name: discord-bot
        image: "{{ docker_image }}"
        state: started
        restart_policy: always
        volumes:
          - "{{ app_dir }}/.env:/app/.env"
        ports:
          - "8080:8080"
        memory: 800m
        log_driver: gcplogs
        log_options:
          gcp-log-cmd: "true"

    - name: Prune unused Docker images
      shell: docker system prune -af
      changed_when: false
