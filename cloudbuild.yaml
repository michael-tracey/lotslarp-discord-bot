# This file is used by Google Cloud Build to build and deploy the Discord bot.

steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/$_SERVICE_NAME:$BUILD_ID', '.']

  # 2. Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/$_SERVICE_NAME:$BUILD_ID']

  # 3. Deploy the Docker image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/$_SERVICE_NAME:$BUILD_ID'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--cpu=1'
      - '--memory=512Mi'
      - '--no-cpu-throttling'
      - '--min-instances=1'
      - '--max-instances=3'
      - '--no-allow-unauthenticated'
      # --- Environment Variables ---
      # The deploy.sh script will create/update the secrets in Google Secret Manager.
      # This step attaches the secrets to the Cloud Run service.
      - '--update-secrets=LOTSLARP_DISCORD_BOT_DISCORD_TOKEN=LOTSLARP_DISCORD_BOT_DISCORD_TOKEN:latest,LOTSLARP_DISCORD_BOT_GEMINI_API_KEY=LOTSLARP_DISCORD_BOT_GEMINI_API_KEY:latest,LOTSLARP_DISCORD_BOT_SUMMARY_ROLE_NAME=LOTSLARP_DISCORD_BOT_SUMMARY_ROLE_NAME:latest,LOTSLARP_DISCORD_BOT_DIGEST_CHANNEL_ID=LOTSLARP_DISCORD_BOT_DIGEST_CHANNEL_ID:latest,LOTSLARP_DISCORD_BOT_GEMINI_MODEL=LOTSLARP_DISCORD_BOT_GEMINI_MODEL:latest,LOTSLARP_DISCORD_BOT_GEMINI_PROMPT=LOTSLARP_DISCORD_BOT_GEMINI_PROMPT:latest,LOTSLARP_DISCORD_BOT_DIGEST_CRON=LOTSLARP_DISCORD_BOT_DIGEST_CRON:latest,LOTSLARP_DISCORD_BOT_DIGEST_CADENCE_NAME=LOTSLARP_DISCORD_BOT_DIGEST_CADENCE_NAME:latest,LOTSLARP_BOT_SUMMARY_CHANNEL_ID=LOTSLARP_BOT_SUMMARY_CHANNEL_ID:latest,LOTSLARP_DISCORD_BOT_CHANNEL_SUMMARY_PROMPT=LOTSLARP_DISCORD_BOT_CHANNEL_SUMMARY_PROMPT:latest,LOTSLARP_BOT_MAX_MESSAGES_BEFORE_DIGEST=LOTSLARP_BOT_MAX_MESSAGES_BEFORE_DIGEST:latest,LOTSLARP_BOT_MAX_TIME_BEFORE_DIGEST=LOTSLARP_BOT_MAX_TIME_BEFORE_DIGEST:latest,LOTSLARP_BOT_ADMIN_USER=LOTSLARP_BOT_ADMIN_USER:latest,LOTSLARP_BOT_SUMMARY_REMINDER_MESSAGES_COUNT=LOTSLARP_BOT_SUMMARY_REMINDER_MESSAGES_COUNT:latest,LOTSLARP_BOT_SUMMARY_REMINDER_LOOKBACK_DAYS=LOTSLARP_BOT_SUMMARY_REMINDER_LOOKBACK_DAYS:latest,LOTSLARP_BOT_SUMMARY_REMINDER_ACTIVITY_DAYS=LOTSLARP_BOT_SUMMARY_REMINDER_ACTIVITY_DAYS:latest,LOTSLARP_BOT_SUMMARY_THROTTLE_CHANNEL_COUNT=LOTSLARP_BOT_SUMMARY_THROTTLE_CHANNEL_COUNT:latest,LOTSLARP_BOT_SUMMARY_REMINDER_MIN_WORDS=LOTSLARP_BOT_SUMMARY_REMINDER_MIN_WORDS:latest,LOTSLARP_BOT_ARCHIVE_REMINDER_INACTIVITY_DAYS=LOTSLARP_BOT_ARCHIVE_REMINDER_INACTIVITY_DAYS:latest,LOTSLARP_BOT_ARCHIVE_INACTIVITY_DAYS=LOTSLARP_BOT_ARCHIVE_INACTIVITY_DAYS:latest,LOTSLARP_BOT_SUMMARY_REMINDER_ROLE_NAMES=LOTSLARP_BOT_SUMMARY_REMINDER_ROLE_NAMES:latest,LOTSLARP_BOT_STALE_CHANNELS_CRON=LOTSLARP_BOT_STALE_CHANNELS_CRON:latest,LOTSLARP_BOT_STALE_CHANNELS_IGNORE_GUILDS=LOTSLARP_BOT_STALE_CHANNELS_IGNORE_GUILDS:latest'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/$_SERVICE_NAME:$BUILD_ID'

substitutions:
  _SERVICE_NAME: 'lotslarp-discord-bot'
  _REGION: 'us-east1'
  _ARTIFACT_REGISTRY_REPO: 'discord-bots'

options:
  logging: CLOUD_LOGGING_ONLY