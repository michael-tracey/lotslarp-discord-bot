ini
[supervisord]
nodaemon=true

[program:discord_bot]
command=python3 /app/discord_bot.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/discord_bot.err.log
stdout_logfile=/var/log/discord_bot.out.log

[program:webui]
command=python3 /app/web_ui.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/webui.err.log
stdout_logfile=/var/log/webui.out.log