<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bot Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
        }
        .table {
            background-color: #fff;
        }
        .table thead {
            background-color: #007bff;
            color: #fff;
        }
    </style>
</head>
<body>
    {% if not user %}
        <div class="container">
            <div class="jumbotron text-center">
                <h1>Welcome to the Discord Bot Dashboard</h1>
                <p>Please log in to view the bot statistics.</p>
                <a href="/login" class="btn btn-primary btn-lg">Login</a>
            </div>
        </div>
    {% else %}
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Discord Bot Statistics</h1>
                <div>
                    {% if user %}
                        <img src="{{ user.picture }}" alt="User Avatar" style="border-radius: 50%; width: 50px; height: 50px; margin-right: 20px;">
                    {% endif %}
                    <a href="/logout" class="btn btn-danger">Logout</a>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Messages Count</th>
                        </tr>
                    </thead>
                    <tbody>                
                        {% for row in stats %}
                        <tr>
                            <td>{{ row.user_id }}</td>
                            <td>{{ row.messages_count }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    {% endif %}
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
